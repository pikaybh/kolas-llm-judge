spec_version: "0.2"
dataset:
  source: "data/raw/kolas_v7_73_test.csv.bz2"
  expected_rows: 843
  expected_scenarios: 425
  grouping: ["공정", "세부공정"]
  input_fields: ["공정", "세부공정", "설비", "물질"]
  reference_fields:
    - "유해위험요인"
    - "사고분류"
    - "위험 가능성"
    - "위험 중대성"
    - "위험성"
    - "감소대책"
    - "관련근거(법규)"

matching:
  semantic_match_threshold: 3
  semantic_match_max: 4
  algorithm: "maximum-weight bipartite matching"

judge:
  provider: "openai"
  model_env: "JUDGE_MODEL"
  default_model: "gpt-5.6-sol"
  reasoning_effort: "medium"
  max_pairs_per_call: 120
  prompt: "prompts/judge_v1.md"
  rubric: "configs/rubric_v1.yaml"

deterministic:
  numeric_methods:
    "빈도강도법 5x4":
      frequency: [1, 5]
      severity: [1, 4]
    "빈도강도법 4x3":
      frequency: [1, 4]
      severity: [1, 3]
    "빈도강도법 3x3":
      frequency: [1, 3]
      severity: [1, 3]
  require_initial_score_math: true
  require_post_score_math: true
  require_post_risk_nonincreasing: true

metrics:
  - reference_risk_coverage
  - unsupported_risk_rate
  - accident_type_correctness
  - mitigation_appropriateness
  - mitigation_specificity
  - legal_basis_presence
  - legal_basis_relevance
  - critical_safety_error_rate
  - schema_compliance
  - deterministic_consistency

calibration:
  source: "pilot"
  pair_sample_size: 150
  generated_sample_size: 150
  repeated_runs: 3
  sampling_seed: 20260908
  gate:
    semantic_binary_agreement_min: 0.90
    semantic_cohen_kappa_min: 0.70
    other_pair_binary_agreement_min: 0.85
    other_pair_cohen_kappa_min: 0.60
    generated_boolean_agreement_min: 0.90
    repeatability_min: 0.95
    minimum_dimension_repeatability_min: 0.95
    structured_completion_min: 0.99
    human_label_completion_min: 1.00
    min_pair_samples_per_dimension: 30
    min_generated_samples_per_dimension: 30
  freeze:
    bind_dataset_sha256: true
    bind_evaluation_source_tree_sha256: true
    bind_prompt_rubric_config_hashes: true
    bind_judge_model_reasoning_chunk_config: true

run:
  max_retries: 3
  request_timeout_seconds: 180
  smoke_cases: 10
  pilot_cases: 50
  full_cases: 425
  require_calibration_gate_for_full: true
  require_stable_sut_source_for_official_candidate: true
