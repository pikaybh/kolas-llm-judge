rules:
  - "A legal_basis value in GT is corroborating metadata and MUST NOT automatically establish LAW_REGULATION provenance."
  - "EXPERT_AUTHORED MUST NOT be assigned unless authorship evidence exists."
  - "LEGACY_WORKBOOK_ONLY means file lineage is known but authoritative source is unresolved."
  - "verified requires a source locator sufficient for independent retrieval or controlled review."
  - "expert_validated requires completion of the approved expert validation protocol."
  - "reference_hazard_sha256 binds the provenance row to frozen GT content without copying proprietary hazard text."
