[project]
name = "kolas-llm-judge"
version = "0.1.0"
description = "Independent reproducible LLM-as-Judge evaluation harness for SEEXR risk assessment"
readme = "README.md"
authors = [
    { name = "SEEXR" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
kolas-llm-judge = "kolas_llm_judge.cli:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
